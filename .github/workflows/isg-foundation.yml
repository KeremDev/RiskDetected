    branches: [main]
    paths:
      - 'scripts/isg/**'
      - 'tests/isg/**'
      - 'contracts/isg/**'
      - 'docs/isg/**'
      - 'App/Services/RDConfig.swift'
      - 'App/Services/ClientFlowEvents.swift'
      - 'App/Services/ISG/**'
      - 'App/Services/Auth/**'
      - 'App/Services/AuthService.swift'
      - 'App/Services/Company/**'
      - 'App/Services/CompanyService.swift'
      - 'App/Views/Profile/ProfileView.swift'
      - 'App/Views/Components/NovaCompanyManagementGate.swift'
      - 'App/Models/Company.swift'
      - 'android/core/data/src/main/kotlin/com/riskdetectedan/core/data/company/**'
      - 'android/feature/profile/**'
      - 'android/core/data/src/main/kotlin/com/riskdetectedan/core/data/SupabaseModule.kt'
      - 'supabase/functions/auth-send-email-hook/**'
      - 'supabase/functions/_shared/auth-email-localization*'
      - 'android/core/data/src/main/kotlin/com/riskdetectedan/core/data/auth/**'
      - 'android/core/data/src/test/kotlin/com/riskdetectedan/core/data/auth/**'
      - 'App/DesignSystem/ISG/**'
      - 'App/Resources/Fonts/PlusJakartaSans-*'
      - 'App/Resources/Fonts/OFL-PlusJakartaSans.txt'
      - 'App/Resources/NovaIcons.xcassets/**'
      - 'Config/RiskDetectedInfo.plist'
      - 'android/core/designsystem/**'
      - 'supabase/functions/_shared/isg/**'
      - 'supabase/functions/_shared/personnel/**'
      - 'android/core/data/src/test/kotlin/com/riskdetectedan/core/data/company/**'
      - 'supabase/migrations/20260513223911_fix_subscription_quota_review_findings.sql'
      - 'supabase/migrations/20260520154818_add_companies.sql'
      - 'supabase/migrations/20260513101505_free_plus_pro_subscription_system.sql'
      - 'supabase/migrations/20260913074153_isg_personnel_owner_rpc.sql'
      - 'supabase/migrations/20260913081536_isg_workplace_context_assignments.sql'
      - 'supabase/migrations/20260913084736_isg_workspace_availability.sql'
      - 'supabase/migrations/20260913092642_isg_personnel_reactivation.sql'
      - 'supabase/migrations/20260913110000_isg_event_dispatch.sql'
      - 'supabase/migrations/20260913113000_isg_quota_reservations.sql'
      - 'supabase/migrations/20260913130000_isg_file_core.sql'
      - 'supabase/migrations/20260913150000_isg_rule_core.sql'
      - 'supabase/migrations/20260913170000_isg_training_core.sql'
      - 'android/core/data/src/main/kotlin/com/riskdetectedan/core/data/isg/**'
      - 'android/core/data/src/test/kotlin/com/riskdetectedan/core/data/isg/**'
      - 'RiskDetected.xcodeproj/project.pbxproj'
      - 'android/app/build.gradle.kts'
      - 'android/settings.gradle.kts'
      - 'android/core/data/build.gradle.kts'
      - 'android/isg-contract-tests/**'
      - 'android/isg-design-preview/**'
      - 'RiskDetected.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
      - 'android/core/data/src/main/kotlin/com/riskdetectedan/core/data/telemetry/ClientFlowEvents.kt'
      - 'scripts/client_flow_contract_test.mjs'
      - '.github/workflows/isg-foundation.yml'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

concurrency:
  group: isg-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No Supabase secrets, production backups, network tests, installs or deploys.
      - name: Verify immutable identity and source contract
        run: node scripts/isg/verify_identity.mjs
      - name: Verify acceptance inventory (not acceptance execution)
        run: node scripts/isg/build_test_manifest.mjs
      - name: Verify new transport function-test bindings
        run: node scripts/isg/verify_function_map.mjs
      - name: Run offline foundation and legacy regression
        run: node scripts/isg/run_suite.mjs foundation
      - name: Verify password and confirmation test isolation
        run: node scripts/isg/run_suite.mjs password-auth
      - name: Verify pinned expert design, font assets and native source drift
        run: node scripts/isg/run_suite.mjs nova-design
      - name: Run non-authoritative legacy capacity shadow model
        run: node scripts/isg/run_suite.mjs capacity-shadow
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - name: Deno shared mutation fixtures (no network or env permissions)
        run: deno test --allow-read=contracts/isg/v1/fixtures supabase/functions/_shared/isg/mutation-context_test.ts supabase/functions/_shared/isg/mutation-outcome_test.ts
      - name: Auth email locale/action compatibility (renderer and source guards, not provider delivery)
        run: deno test --allow-read=supabase/functions/auth-send-email-hook,supabase/functions/_shared supabase/functions/_shared/auth-email-localization_test.ts supabase/functions/auth-send-email-hook/index_static_test.ts
      - name: Personnel request shared contract
        run: deno test --allow-read=contracts/isg/v1/fixtures supabase/functions/_shared/personnel/assignment-move_test.ts supabase/functions/_shared/personnel/employee-create_test.ts

  swift-transport-fixtures:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Pure Foundation type only: no signing, app launch, SDK resolution or secrets.
      - name: Compile transport model and fixture harness
        run: swiftc App/Services/ISG/IsgMutationContext.swift scripts/isg/MutationContextCheck.swift -o "$RUNNER_TEMP/isg-context-check"
      - name: Verify new-password rules against shared Unicode boundary fixtures
        run: |
          swiftc App/Services/Auth/IsgPasswordRules.swift scripts/isg/IsgPasswordRulesCheck.swift -o "$RUNNER_TEMP/isg-password-check"
          "$RUNNER_TEMP/isg-password-check" contracts/isg/v1/fixtures/password-rules.json
      - name: Verify assignment request corpus shared with Android and server
        run: |
          swiftc App/Services/ISG/IsgMutationContext.swift App/Services/Company/IsgAssignmentMove.swift scripts/isg/AssignmentMoveCheck.swift -o "$RUNNER_TEMP/isg-assignment-check"
          "$RUNNER_TEMP/isg-assignment-check" contracts/isg/v1/fixtures/assignment-move.json
      - name: Verify simplified employee intake shared with Android and server
        run: |
          swiftc App/Services/ISG/IsgMutationContext.swift App/Services/Company/IsgEmployeeCreate.swift scripts/isg/EmployeeCreateCheck.swift -o "$RUNNER_TEMP/isg-employee-check"
          "$RUNNER_TEMP/isg-employee-check" contracts/isg/v1/fixtures/employee-create.json
      - name: Verify the same corpus as Kotlin and Deno
        run: '"$RUNNER_TEMP/isg-context-check" contracts/isg/v1/fixtures/mutation-context.json'
      - name: Compile and verify mutation outcomes and state transitions
        run: |
          swiftc App/Services/ISG/IsgMutationOutcome.swift scripts/isg/MutationOutcomeCheck.swift -o "$RUNNER_TEMP/isg-outcome-check"
          "$RUNNER_TEMP/isg-outcome-check" contracts/isg/v1/fixtures/mutation-outcome.json
      - name: Verify native NOVA tokens, fonts and Turkish glyphs
        run: |
          swiftc App/DesignSystem/ISG/NovaTokens.swift scripts/isg/NovaTokenCheck.swift -o "$RUNNER_TEMP/isg-nova-check"
          "$RUNNER_TEMP/isg-nova-check" contracts/isg/v1/design/nova-native-values.json App/Resources/Fonts
      - name: Verify shared expert shell navigation corpus
        run: |
          swiftc App/DesignSystem/ISG/NovaNavigation.swift scripts/isg/NovaNavigationCheck.swift -o "$RUNNER_TEMP/isg-nova-navigation-check"
          "$RUNNER_TEMP/isg-nova-navigation-check" contracts/isg/v1
      - name: Verify company load ownership, latest-request and selection corpus
        run: |
          swiftc App/DesignSystem/ISG/NovaNavigation.swift App/DesignSystem/ISG/NovaSessionHost.swift App/DesignSystem/ISG/NovaCompanyListState.swift scripts/isg/NovaCompanyListCheck.swift -o "$RUNNER_TEMP/isg-company-list-check"
          "$RUNNER_TEMP/isg-company-list-check" contracts/isg/v1/fixtures/nova-company-list.json
      - name: Verify personnel editor retry and scope invariants
        run: |
          swiftc App/DesignSystem/ISG/NovaPersonnel.swift scripts/isg/NovaPersonnelCheck.swift -o "$RUNNER_TEMP/isg-personnel-check"
          "$RUNNER_TEMP/isg-personnel-check"
      - name: Verify workspace capability response correlation
        run: |
          swiftc App/DesignSystem/ISG/NovaPersonnel.swift App/DesignSystem/ISG/NovaWorkspaceCapability.swift tests/isg/NovaWorkspaceCapabilityCheck.swift -o "$RUNNER_TEMP/isg-workspace-check"
          "$RUNNER_TEMP/isg-workspace-check"
      - name: Verify directory scalar contract and persisted personnel recovery
        # Actual service logic with an injected in-memory journal; no Keychain calls or network.
        run: |
          swiftc App/DesignSystem/ISG/NovaPersonnel.swift App/DesignSystem/ISG/NovaDirectory.swift scripts/isg/NovaDirectoryCheck.swift -o "$RUNNER_TEMP/isg-directory-check"
          swiftc -parse-as-library App/DesignSystem/ISG/NovaPersonnel.swift App/DesignSystem/ISG/NovaDirectory.swift tests/isg/NovaDirectoryFormRulesCheck.swift -o "$RUNNER_TEMP/isg-directory-form-check"
          "$RUNNER_TEMP/isg-directory-form-check"
          "$RUNNER_TEMP/isg-directory-check"
          swiftc App/DesignSystem/ISG/NovaPersonnel.swift App/Services/Company/NovaPersonnelService.swift scripts/isg/NovaPersonnelServiceCheck.swift -o "$RUNNER_TEMP/isg-personnel-service-check"
          "$RUNNER_TEMP/isg-personnel-service-check"
      - name: Verify account-scoped NOVA host corpus
        # Presentation session fixtures run without any Auth SDK or network.
        # Runtime UI ownership is separately exercised by ios-shell-integration.
        if: success()
        shell: bash
        run: |
          swiftc App/DesignSystem/ISG/NovaNavigation.swift App/DesignSystem/ISG/NovaSessionHost.swift scripts/isg/NovaSessionHostCorpus.swift scripts/isg/NovaSessionHostCheck.swift -o "$RUNNER_TEMP/isg-nova-host-check"
          "$RUNNER_TEMP/isg-nova-host-check" contracts/isg/v1/fixtures/nova-session-host.json
      - name: Run hostless iOS XCTest on an available CI iPhone
        shell: bash
        run: |
          ISG_CI_SIMULATOR_ID="$(xcrun simctl list devices available -j | node -e '
            const fs = require("node:fs");
            const inventory = JSON.parse(fs.readFileSync(0, "utf8"));
            const runtime = Object.keys(inventory.devices).filter(k => /\.iOS-/.test(k)).sort((a,b) => b.localeCompare(a,"en",{numeric:true}));
            const phone = runtime.flatMap(k => inventory.devices[k]).find(d => d.isAvailable && /^iPhone /.test(d.name) && /^[A-F0-9-]{36}$/i.test(d.udid));
            if (!phone) process.exit(1);
            console.log(phone.udid);
          ')"
          xcodebuild test -project tests/isg/ios/ISGContractTests.xcodeproj -scheme ISGContractTests \
            -destination "platform=iOS Simulator,id=$ISG_CI_SIMULATOR_ID" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/isg-native-derived" -resultBundlePath "$RUNNER_TEMP/isg-native.xcresult" \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO
          xcodebuild test -project tests/isg/design-ios/ISGDesignTests.xcodeproj -scheme ISGDesignTests \
            -destination "platform=iOS Simulator,id=$ISG_CI_SIMULATOR_ID" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/isg-design-derived" -resultBundlePath "$RUNNER_TEMP/isg-design.xcresult" \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isg-ios-native-contract-results
          path: |
            ${{ runner.temp }}/isg-native.xcresult
            ${{ runner.temp }}/isg-design.xcresult
          if-no-files-found: warn

  ios-shell-integration:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Separate simulator-only synthetic executable. No main app, services or secrets.
      - name: Verify native shell isolation and source inventory
        run: node scripts/isg/run_suite.mjs nova-design
      - name: Run hosted shell interaction tests
        shell: bash
        run: |
          ISG_SHELL_SIMULATOR_ID="$(xcrun simctl list devices available -j | node -e '
            const fs = require("node:fs");
            const inventory = JSON.parse(fs.readFileSync(0, "utf8"));
            const runtimes = Object.keys(inventory.devices).filter(k => /\.iOS-/.test(k)).sort((a,b) => b.localeCompare(a,"en",{numeric:true}));
            const phone = runtimes.flatMap(k => inventory.devices[k]).find(d => d.isAvailable && /^iPhone /.test(d.name) && /^[A-F0-9-]{36}$/i.test(d.udid));
            if (!phone) process.exit(1);
            console.log(phone.udid);
          ')"
          xcodebuild test -project tests/isg/shell-ios/ISGShellHarness.xcodeproj -scheme ISGShellHarness \
            -destination "platform=iOS Simulator,id=$ISG_SHELL_SIMULATOR_ID" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/isg-shell-derived" -resultBundlePath "$RUNNER_TEMP/isg-shell.xcresult" \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/isg-shell.xcresult" --compact | node -e '
            const fs = require("node:fs"), assert = require("node:assert/strict");
            const summary = JSON.parse(fs.readFileSync(0, "utf8"));
            const source = fs.readFileSync("tests/isg/shell-ios/ShellUITests.swift", "utf8");
            const expected = (source.match(/^    func test\w+\(/gm) ?? []).length;
            assert.ok(expected >= 8);
            assert.equal(summary.passedTests, expected);
            assert.equal(summary.failedTests, 0);
            assert.equal(summary.skippedTests, 0);
          '
          # Simulator-only ad-hoc identity, never the production Keychain access group.
          xcodebuild test -project tests/isg/journal-ios/ISGJournalHarness.xcodeproj -scheme ISGJournalHarness \
            -destination "platform=iOS Simulator,id=$ISG_SHELL_SIMULATOR_ID" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/isg-journal-derived" -resultBundlePath "$RUNNER_TEMP/isg-journal.xcresult" \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/isg-journal.xcresult" --compact | node -e '
            const fs = require("node:fs"), assert = require("node:assert/strict");
            const s = JSON.parse(fs.readFileSync(0,"utf8"));
            assert.equal(s.passedTests, 1); assert.equal(s.failedTests, 0); assert.equal(s.skippedTests, 0);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isg-ios-hosted-shell-results
          path: |
            ${{ runner.temp }}/isg-shell.xcresult
            ${{ runner.temp }}/isg-journal.xcresult
          if-no-files-found: warn

  postgres-transaction-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Image download is the only network preparation. Test container has no
      # network, ports, mounts, real data or credentials. It is not a local reset.
      - name: Fetch immutable database test image
        run: docker pull public.ecr.aws/supabase/postgres@sha256:3866d94d8426927e8db3f1c5d790752292bfbe27b5f1f46e199ae1b7d3c1710b
      - name: Transaction, retry, fault injection and lease tests
        run: node scripts/isg/run_database_contract.mjs contracts/isg/v1/local-test-environment.example.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isg-synthetic-db-evidence
          path: output/isg/runs/*/database-contract.json
          if-no-files-found: warn

  auth-session-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      # Immutable multi-arch images. No real backups/Keychain or project secrets.
      # Image preparation is networked; all four test containers share NONE.
      - name: Fetch pinned synthetic Auth runtime images
        run: |
          docker pull public.ecr.aws/supabase/postgres@sha256:3866d94d8426927e8db3f1c5d790752292bfbe27b5f1f46e199ae1b7d3c1710b
          docker pull public.ecr.aws/supabase/gotrue@sha256:362659ca70eaa75ba05bbaf963caa84c1c5afe5e8fbf0777e17b830dd5f0f60a
          docker pull public.ecr.aws/supabase/storage-api@sha256:28424184c9f699790cc190f78ddf7d6abfb5c87af78af260529a394d12c135e9
          docker pull public.ecr.aws/supabase/postgrest@sha256:2f8e7b656f09db697a8875177694b417b35cb76c21370de07fc54e711e902326
      - name: Real local login, SQL session guard, lock ordering and logout
        run: node scripts/isg/run_auth_restore.mjs --synthetic-session
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isg-synthetic-auth-session-evidence
          path: output/isg/runs/synthetic-auth-*/REPORT.json
          if-no-files-found: warn
