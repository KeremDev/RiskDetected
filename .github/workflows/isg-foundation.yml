      - 'App/Views/Components/NovaCompanyManagementGate.swift'
      - 'App/Models/Company.swift'
      - 'android/core/data/src/main/kotlin/com/riskdetectedan/core/data/company/**'
      - 'android/feature/profile/**'
      - 'android/core/data/src/main/kotlin/com/riskdetectedan/core/data/SupabaseModule.kt'
