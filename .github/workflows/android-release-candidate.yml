name: android-release-candidate

on:
  workflow_dispatch:
    inputs:
      expected_version_code:
        description: "Play Console'da kullanılmamış versionCode"
        required: true
        type: string
        default: "10"

permissions:
  contents: read

concurrency:
  group: android-release-candidate
  cancel-in-progress: false

jobs:
  validate-release-inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate expected versionCode
        env:
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
        run: |
          if [[ ! "$EXPECTED_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "expected_version_code must be a positive decimal integer" >&2
            exit 2
          fi

  backend-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Android release coordinates
        env:
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
        run: |
          actual=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)$/\1/p' android/app/build.gradle.kts)
          test "$actual" = "$EXPECTED_VERSION_CODE"
          grep -q 'versionName = "2.0.0"' android/app/build.gradle.kts

      - name: Verify production release notes
        run: |
          test "$(wc -m < android/play-store/metadata/2.0.0/release-notes-tr.txt)" -le 500
          test "$(wc -m < android/play-store/metadata/2.0.0/release-notes-en.txt)" -le 500
          grep -q 'Kapalı test kullanıcılarımızın geri bildirimleri doğrultusunda' android/play-store/metadata/2.0.0/release-notes-tr.txt
          grep -q 'Based on feedback from our closed-test users' android/play-store/metadata/2.0.0/release-notes-en.txt

      - name: Verify unique migration timestamps
        run: |
          duplicates=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | cut -d_ -f1 \
            | sort \
            | uniq -d)
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate Supabase migration timestamps:" >&2
            echo "$duplicates" >&2
            exit 1
          fi

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
          cache: true

      - name: Deno format and changed-worker lint
        run: |
          deno fmt --check \
            supabase/functions/_shared/approved-notebook-advisory-language.ts \
            supabase/functions/_shared/approved-notebook-advisory-language_test.ts \
            supabase/functions/_shared/approved-notebook-advisory-snapshot.ts \
            supabase/functions/_shared/approved-notebook-advisory-snapshot_test.ts \
            supabase/functions/_shared/approved-notebook-projector.ts \
            supabase/functions/_shared/approved-notebook-projector_test.ts \
            supabase/functions/_shared/training-recommendations/snapshot.ts \
            supabase/functions/_shared/training-recommendations/snapshot_test.ts \
            supabase/functions/analyze-v4/index.ts \
            supabase/functions/analyze-v4/v5_expert_training_test.ts \
            supabase/functions/analyze-vnext/index.ts \
            supabase/functions/analysis-result-sections/index.ts \
            supabase/functions/analysis-result-sections/index_static_test.ts \
            supabase/functions/app-release-policy/index.ts \
            supabase/functions/app-release-policy/index_static_test.ts
          deno lint --rules-exclude=no-import-prefix,no-explicit-any \
            supabase/functions/_shared/approved-notebook-advisory-language.ts \
            supabase/functions/_shared/approved-notebook-advisory-language_test.ts \
            supabase/functions/_shared/approved-notebook-advisory-snapshot.ts \
            supabase/functions/_shared/approved-notebook-advisory-snapshot_test.ts \
            supabase/functions/_shared/approved-notebook-projector.ts \
            supabase/functions/_shared/approved-notebook-projector_test.ts \
            supabase/functions/_shared/training-recommendations/snapshot.ts \
            supabase/functions/_shared/training-recommendations/snapshot_test.ts \
            supabase/functions/analyze-v4/index.ts \
            supabase/functions/analyze-v4/v5_expert_training_test.ts \
            supabase/functions/analyze-vnext/index.ts \
            supabase/functions/analysis-result-sections/index.ts \
            supabase/functions/analysis-result-sections/index_static_test.ts \
            supabase/functions/app-release-policy/index.ts \
            supabase/functions/app-release-policy/index_static_test.ts \
            supabase/functions/request-account-deletion/index.ts \
            supabase/functions/account-deletion-complete/index.ts \
            supabase/functions/process-account-deletion-queue/index.ts

      - name: Edge Function tests
        run: find supabase/functions -type f \( -name '*test.ts' -o -name '*static_test.ts' \) -print0 | sort -z | xargs -0 --no-run-if-empty deno test --allow-read

      - uses: supabase/setup-cli@v2
        with:
          version: 2.113.0

      - name: Start isolated local Supabase
        run: supabase db start

      - name: pgTAP, RLS, RPC and gate tests
        run: supabase test db --local

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup

  android-quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-37.1" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Deterministic test environment
        run: |
          echo "LANG=C.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=C.UTF-8" >> "$GITHUB_ENV"
          echo "TZ=Europe/Istanbul" >> "$GITHUB_ENV"
          # Keep native library resolution locale-stable. A Turkish JVM locale lowercases
          # "Linux" to "lınux", which makes Conscrypt look for a non-existent JNI binary.
          # Android/Robolectric UI locale is configured by the tests and resources themselves.
          echo "JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Duser.timezone=Europe/Istanbul" >> "$GITHUB_ENV"
          echo "RD_BUILD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Environment and legal isolation
        run: ./gradlew :app:verifyEnvironmentIsolation :app:verifyAndroidLegalBundle --stacktrace

      - name: Source secret, PII log and AD_ID scan
        run: bash scripts/scan-source-secrets-and-pii.sh

      - name: Unit and exact Android goldens
        run: ./gradlew testDebugUnitTest verifyRoborazziDebug -Proborazzi.dumpUiTree=true --stacktrace

      - name: Lint, debug and QA
        run: ./gradlew lint :app:assembleDebug :app:assembleQa --stacktrace

      - name: Verify merged QA permissions
        run: bash scripts/scan-source-secrets-and-pii.sh app/build/outputs/apk/qa/app-qa.apk

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-evidence
          path: |
            android/**/build/reports
            android/**/build/test-results
            android/**/build/outputs/roborazzi
          if-no-files-found: ignore

  signed-aab:
    needs: [validate-release-inputs, backend-contracts, android-quality]
    runs-on: ubuntu-24.04
    environment: android-production-release
    defaults:
      run:
        working-directory: android
    env:
      RD_BUILD_SHA: ${{ github.sha }}
      RD_PRODUCTION_SUPABASE_URL: ${{ secrets.RD_PRODUCTION_SUPABASE_URL }}
      RD_PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.RD_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      RD_PRODUCTION_GOOGLE_WEB_CLIENT_ID: ${{ secrets.RD_PRODUCTION_GOOGLE_WEB_CLIENT_ID }}
      RD_PRODUCTION_REVENUECAT_PUBLIC_KEY: ${{ secrets.RD_PRODUCTION_REVENUECAT_PUBLIC_KEY }}
      RD_PRODUCTION_FIREBASE_PROJECT_ID: ${{ secrets.RD_PRODUCTION_FIREBASE_PROJECT_ID }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-37.1" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode owner-controlled upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/riskdetected-upload.jks"
          echo "ANDROID_UPLOAD_STORE_FILE=$RUNNER_TEMP/riskdetected-upload.jks" >> "$GITHUB_ENV"

      - name: Verify unused versionCode input
        env:
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
        run: |
          actual=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts)
          [[ "$EXPECTED_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          test "$actual" = "$EXPECTED_VERSION_CODE"

      - name: Verify owner upload certificate fingerprint
        run: |
          test -n "$ANDROID_UPLOAD_CERT_SHA256"
          actual=$(keytool -list -v \
            -keystore "$ANDROID_UPLOAD_STORE_FILE" \
            -alias "$ANDROID_UPLOAD_KEY_ALIAS" \
            -storepass:env ANDROID_UPLOAD_STORE_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$actual"
          test "$actual" = "$expected"

      - name: Verify production admits the release build
        env:
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
        run: |
          payload=$(jq -cn --arg build "$EXPECTED_VERSION_CODE" '{
            client_platform:"android",
            client_app_version:"2.0.0",
            client_app_build:$build,
            api_contract_version:3,
            client_capabilities:{
              multi_photo_analysis:true,
              multi_photo_coverage_v2:true,
              editable_findings:true,
              report_snapshot_v2:true,
              safety_claim_v4_scoreless:true,
              analysis_result_hub_v1:true,
              global_localization_wave1:true
            },
            app_language:"en",
            content_locale:"en-US",
            work_jurisdiction_country:"US",
            safety_profile_id:"en-us-generic-v1",
            safety_profile_version:1,
            android_legal_context:null
          }')
          response=$(curl --fail --silent --show-error \
            -H "apikey: $RD_PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $RD_PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            "$RD_PRODUCTION_SUPABASE_URL/functions/v1/app-release-policy" \
            --data "$payload")
          jq -e --argjson expected "$EXPECTED_VERSION_CODE" '
            .ok == true and
            .policy.hard_update_enabled == false and
            .android_runtime_gates.evaluated_version_code == $expected and
            ([
              .android_runtime_gates.client.enabled,
              .android_runtime_gates.auth.enabled,
              .android_runtime_gates.analysis_submit.enabled,
              .android_runtime_gates.payments.enabled,
              .android_runtime_gates.notifications.enabled,
              .android_runtime_gates.pdf_reports.enabled
            ] | all)
          ' <<< "$response" >/dev/null

      - name: Build minified signed AAB and release lint
        run: ./gradlew :app:lintRelease :app:bundleRelease --stacktrace

      - name: Install pinned bundletool
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check

      - name: Validate signature, 16 KB, ELF, assets and secrets
        run: bash scripts/verify-release-artifacts.sh app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/bundletool.jar" | tee app/build/outputs/bundle/release/verification.txt

      - name: Package available native symbol tables for Play
        run: bash scripts/extract-play-native-symbols.sh app/build/outputs/bundle/release/app-release.aab app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip

      - name: Upload release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: riskdetected-android-2.0.0-vc${{ inputs.expected_version_code }}-release-candidate
          retention-days: 30
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/verification.txt
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/mapping/release/configuration.txt
            android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
            android/app/build/outputs/native-debug-symbols/release/native-debug-symbols-unavailable.txt
            android/app/build/reports/lint-results-release.html
            android/play-store/metadata/2.0.0
