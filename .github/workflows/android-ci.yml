name: android-ci

# First CI pipeline in this repo (review §28 "CI/CD" — previously all manual via scripts/).
# Scope: Android only for now. Runs on every PR/push touching android/ or contracts/ — the
# latter because a contracts/ change without a matching Android update is exactly the failure
# mode Bölüm D.2 exists to prevent.

on:
  pull_request:
    paths:
      - "android/**"
      - "contracts/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "contracts/**"

defaults:
  run:
    working-directory: android

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 37 (compileSdk)
        run: sdkmanager --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests (all modules)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: android/**/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # release/qa builds are NOT built in CI — they need real staging/production Supabase keys
  # (DEC-12) and a signing keystore (master §9.3: "CI secret store dışında keystore bulunmaz"),
  # neither of which exists yet. Add a signed-release job once those land (Faz 8).
