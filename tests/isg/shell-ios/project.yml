name: ISGShellHarness
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    SUPPORTED_PLATFORMS: iphonesimulator
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  ISGShellHarness:
    type: application
    platform: iOS
    sources:
      - path: ShellHarnessApp.swift
      - path: PersonnelHarness.swift
      - path: ../../../App/DesignSystem/ISG/NovaPersonnel.swift
      - path: ../../../App/DesignSystem/ISG/NovaPersonnelScreens.swift
      - path: ../../../App/DesignSystem/ISG/NovaDirectory.swift
      - path: ../../../App/DesignSystem/ISG/NovaDirectoryScreens.swift
      - path: ../../../App/DesignSystem/ISG/NovaTokens.swift
      - path: ../../../App/DesignSystem/ISG/NovaComponents.swift
      - path: ../../../App/DesignSystem/ISG/NovaNavigation.swift
      - path: ../../../App/DesignSystem/ISG/NovaSessionHost.swift
      - path: ../../../App/DesignSystem/ISG/NovaCompanyListState.swift
      - path: ../../../App/DesignSystem/ISG/NovaCompanyDestination.swift
      - path: ../../../App/DesignSystem/ISG/NovaExpertShell.swift
      - path: ../../../App/Resources/NovaIcons.xcassets
        buildPhase: resources
      - path: ../../../App/Resources/Fonts
        includes: ['PlusJakartaSans-*.ttf', 'OFL-PlusJakartaSans.txt']
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riskdetected.isgshellharness
        INFOPLIST_KEY_CFBundleDisplayName: ISG Shell QA
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_FILE: HarnessInfo.plist
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
  ISGShellUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ShellUITests.swift]
    dependencies:
      - target: ISGShellHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riskdetected.isgshelluitests
        TEST_TARGET_NAME: ISGShellHarness
schemes:
  ISGShellHarness:
    build:
      targets:
        ISGShellHarness: all
        ISGShellUITests: [test]
    test:
      targets: [ISGShellUITests]
      gatherCoverageData: false
      parallelizeBuild: false
